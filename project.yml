name: Scripta
options:
  bundleIdPrefix: com.ronanwood
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

# The pure core lives in a local SwiftPM package (statically linked — invisible to the bundle
# layout and App Review). Unit tests moved with it: `swift test --package-path Core`; the eval
# harness is its `scripta-eval` executable (`./Eval/run.sh`).
packages:
  ScriptaCore:
    path: Core

# One app, two flavors sharing this template. `Scripta` (direct .dmg) bundles the MCP
# helper; `Scripta-MAS` (App Store) must not — embedded executables have to inherit the
# app's sandbox, which breaks external spawning by LLM clients, so the store flavor offers the
# helper as a separate download instead. Same bundle ID: they are the same app to macOS/TCC.
targetTemplates:
  ScriptaApp:
    type: application
    platform: macOS
    sources:
      # Sources/Gallery is the design system's review surface and belongs to the `Gallery` target
      # alone. Without this exclude a bare `- Sources` sweeps it into the app: two @main entry
      # points, and a gallery that ships inside the product it was built to keep at arm's length.
      #
      # Sources/Theme/Components is excluded for a different reason: it makes each migration ADD
      # the components it needs to the product deliberately, in a reviewed pass, instead of the
      # product carrying a second, unreviewed UI vocabulary alongside CarbonKit that any view can
      # reach for early. The directory-level exclude therefore STAYS now that the first view has
      # migrated — the six files the Viewer needs are named individually below, and the remaining
      # ten are still dead code in this target.
      #
      # Sources/Theme/Tokens deliberately stays IN, and the line is NOT "values in, views out" —
      # that reading is simply false: Register, Metrics and Surface each ship View extensions
      # (`typeface`, `proseText`, `controlBox`, `surface`, `hairline`, `staleUnderline`) into both
      # flavors. The real boundary is what a migrating view needs ON DAY ONE versus what it must
      # not reach for before its own pass. A view being ported has to name a colour, a type role, a
      # gap and a corner, and it has to be able to APPLY them — a token layer whose modifiers were
      # out would be ported around, not ported to. What it must not have early is the second UI
      # vocabulary: a `Card`, a `Pill`, a `ListRow` adopted ad hoc is a component nobody reviewed
      # sitting in the product beside CarbonKit.
      #
      # The cost, stated rather than discovered: an app view can call `.surface()` or `.controlBox()`
      # today, outside any reviewed pass, and nothing here stops it. That is accepted because those
      # modifiers are one wrap over a token each — the wrong ARGUMENT is a contrast finding the gate
      # already scores, where a wrong component is a whole unreviewed control.
      - path: Sources
        excludes:
          - Gallery
          - Gallery/**
          - Theme/Components
          - Theme/Components/**
      # The Viewer migration's ADD. Six of the sixteen components, named one by one rather than by
      # lifting the exclude: the directory stays out so the next four migrations each have to make
      # this same deliberate choice, and so "what is in the product" is readable here rather than
      # inferred from whoever imported what.
      #
      # `ControlState` is not optional and not a component — it is the plumbing (`ControlPhase`,
      # `ControlPalette`, `ControlSkin`, `Pressable`, `Tone.clear`) that the other four are written
      # against; none of them compiles without it.
      #
      #   ControlState   — required by all four below
      #   ControlIcon    — `Glyph`/`Icon`: the reader's six action-row icons and two header glyphs
      #   ControlButton  — `IconButton`: those six action-row buttons
      #   ControlPill    — `Pill`: the tag chips and the Conference mark in the header
      #   ControlField   — `InputField`: the three fields in `TranscriptDetailsEditor`
      #
      # `SpokenLine` is the sixth and arrives by a different route from the five above: it was not
      # adopted from the system, it was PROMOTED into it. The reader's most-repeated row was built
      # locally in `TranscriptDetail` because the system had no component for a stamped, attributed
      # line of speech — while the gallery carried a private one in a different layout. Naming it
      # here is what puts the row inside the contrast gate's scan, which never reaches app views:
      # `SpeakerMark` also ships with it, and `TranscriptExporter` reads the same mark for print.
      #
      # NOT added, and each for a reason worth keeping: `SurfaceCard`/`SurfaceRow`/`SurfaceEmpty`
      # (the reader has no card, list row or empty state), `Passage*` and `Engine*`/`Exclusion*`
      # (they render substrate retrieval, which this view never shows), `ControlProgress` (nothing
      # here reports progress).
      - path: Sources/Theme/Components/ControlState.swift
      - path: Sources/Theme/Components/ControlIcon.swift
      - path: Sources/Theme/Components/ControlButton.swift
      - path: Sources/Theme/Components/ControlPill.swift
      - path: Sources/Theme/Components/ControlField.swift
      - path: Sources/Theme/Components/SpokenLine.swift
      - path: Skill/scripta/SKILL.md
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/CarbonIcons
        buildPhase: resources
      - path: Resources/Licenses
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ScriptaCore
        product: ScriptaCore
      - package: ScriptaCore
        product: ScriptaShared
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Scripta
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Ronan Wood"
        NSMicrophoneUsageDescription: "Scripta records your microphone alongside call audio so your side of the conversation is transcribed. Audio is processed on-device and deleted after transcription."
        NSCalendarsFullAccessUsageDescription: "Scripta reads your upcoming events to show which calls have Zoom/Teams/Meet links. It never modifies your calendar and never auto-starts recording."
        NSSpeechRecognitionUsageDescription: "Scripta transcribes your recordings on-device using Apple's speech recognition. Audio is processed locally and never sent anywhere."
        NSLocalNetworkUsageDescription: "Only used if you connect a local AI server on your own network (e.g. Ollama). The app never talks to the internet."
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronanwood.Scripta
        PRODUCT_NAME: Scripta
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6CTH5M9UWZ
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        # Sandboxed in every configuration: the App Store requires it, and the direct build
        # ships the same way so both channels behave identically.
        CODE_SIGN_ENTITLEMENTS: Sources/App/Scripta.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  Scripta:
    templates: [ScriptaApp]
    dependencies:
      - target: scripta-mcp
        copy:
          destination: executables

  # Build with SYMROOT=build-mas so the two flavors never overwrite each other — a baked
  # CONFIGURATION_BUILD_DIR override breaks SwiftPM module resolution (packages build to the
  # default location; the target would look in the overridden one).
  Scripta-MAS:
    templates: [ScriptaApp]
    # Both flavors share PRODUCT_NAME, so a MAS build into a dir where the direct flavor built
    # earlier (Xcode's shared DerivedData, or a reused SYMROOT) inherits the direct bundle's
    # embedded helper — Xcode never scrubs foreign files. The store flavor must not carry the
    # helper (embedded executables must inherit the sandbox), so re-establish that invariant
    # structurally at the end of every MAS build.
    postBuildScripts:
      - name: Scrub bundled helper (store flavor must not embed it)
        script: rm -f "$CODESIGNING_FOLDER_PATH/Contents/MacOS/scripta-mcp"
        basedOnDependencyAnalysis: false

  scripta-mcp:
    type: tool
    platform: macOS
    sources:
      - SourcesMCP
    dependencies:
      - package: ScriptaCore
        product: ScriptaShared
    settings:
      base:
        PRODUCT_NAME: scripta-mcp
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6CTH5M9UWZ
        ENABLE_HARDENED_RUNTIME: YES
        # Unsandboxed (LLM clients spawn it, so it can't inherit a sandbox), but entitled to
        # the shared App Group so it reads the index + state file without container prompts.
        CODE_SIGN_ENTITLEMENTS: SourcesMCP/scripta-mcp.entitlements

  # The "Record & Register" review surface. A separate runnable app whose whole purpose is that
  # the design system can be accepted or rejected BEFORE it touches an app view.
  #
  # It links two directories under `Sources/Theme`, not `Sources/Theme` wholesale: the Carbon files
  # sitting beside them are the layer this system replaces, and a gallery that could reach them
  # would end up reviewing a blend of the two. It links no app view at all, which is what keeps
  # "the system is reviewable in isolation" a structural fact rather than a habit.
  Gallery:
    type: application
    platform: macOS
    sources:
      - Sources/Gallery
      # BOTH entries are whole DIRECTORIES, and that is the point. "The token layer is Ink,
      # Register, Metrics and Surface" used to be spelled out three times — four by-name paths
      # here, the same four in `DesignSystemSource.tokenLayer()`, and again in prose in
      # GalleryApp — so a fifth token file would have compiled nowhere and gated nowhere,
      # silently. Components has always been a directory precisely so "a component nobody
      # reviewed" cannot happen; the token layer now gets the same guarantee.
      # `Carbon*` stays directly in `Sources/Theme`, which no entry here reaches.
      #
      # `ThemeTokenSource` still names `Tokens/Ink.swift` by path and always will: it parses the
      # palette specifically, not "whatever is in the layer", so that one is a reference to a file
      # rather than a fourth definition of the set.
      - Sources/Theme/Tokens
      - Sources/Theme/Components
      - path: Resources/Fonts
        buildPhase: resources
    # The engine's wire vocabulary, which the answer surfaces render and no longer define. Only the
    # Gallery links it: the app target names six components by path and none of them is an answer
    # surface, so `Passage.swift`'s `@_exported import` — the one place the re-export happens, so
    # every pane keeps naming `Passage` without knowing which module holds it — never reaches the
    # product. The day a migration adds `PassageCard` to the app, this line has to be added there too.
    dependencies:
      - package: ScriptaCore
        product: SubstrateKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronanwood.Scripta.Gallery
        PRODUCT_NAME: Gallery
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Record & Register"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Ad-hoc, unsandboxed, no entitlements: this never leaves the machine that built it, and
        # automatic signing would try to register a second bundle ID with the developer portal
        # before it would run.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  # Unit tests live in the Core package (Core/Tests/ScriptaCoreTests): `swift test --package-path Core`.
  # The contrast gate and the speaker-ramp colour-vision check live there too — see
  # Core/Tests/ScriptaCoreTests/ContrastGateTests.swift for why, and what it costs.

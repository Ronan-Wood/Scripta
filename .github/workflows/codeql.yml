# CodeQL, on Swift: the language this repository's code is written in. The engine, where untrusted
# input lands, is a pinned release of its own repository, and is scanned there.
#
# SCOPE IS DELIBERATE. Swift covers `Core/`, which builds on a runner with one SwiftPM command. The
# app target is NOT scanned: building it means building the bundled engine, an hour of downloading
# and compiling for a target CodeQL analyses no better than the package it already sees.
#
# Actions pinned by commit, for the reason the test workflow gives.
name: code scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Queries improve between pushes; a weekly run catches what a new query finds in old code.
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: codeql swift
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # v2.27.0
        with:
          languages: swift
          build-mode: manual
      - run: swift build --package-path Core
      - uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # v2.27.0

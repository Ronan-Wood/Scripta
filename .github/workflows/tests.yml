# The tests, on a clean machine. This is the half a local build cannot give you: the caches, the
# models and the built engine are all on the developer's Mac, and a runner has none of them.
#
# ACTIONS ARE PINNED BY COMMIT, not by tag. A tag is a moving pointer that its owner can repoint at
# any code, and these jobs run against this repository's contents. The version each hash belongs to
# is in the comment beside it.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here publishes, comments or writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    # THE NAME IS A CONTRACT once a rule requires this check: a required check that never reports
    # blocks every merge.
    #
    # The engine is a pinned release of its own repository (`engine.lock`). This holds the pin to
    # the release: the tarball's SHA-256, the contract's leak scans and wire version, GitHub's tag on
    # the lock's commit, signed and verified, every file in the tarball that commit's, and the app's
    # copy of the contract (`Core/Tests/EngineContract/`) byte for byte the tarball's.
    name: engine pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The token only reads the engine repository's public tag; `contents: read` above is all it has.
      - run: Distribution/fetch-engine --check
        env:
          GH_TOKEN: ${{ github.token }}

  core:
    name: app core
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app's tests read a COPY of the engine's contract, which `engine pin` holds to the pinned
      # release. The package targets macOS 14 and uses no macOS 26 API, so it builds on the runner
      # image even though the app around it requires macOS 26 and cannot be built here at all.
      - run: swift test
        working-directory: Core

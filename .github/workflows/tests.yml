# The tests, on a clean machine. This is the half a local build cannot give you: the caches, the
# models and the built engine are all on the developer's Mac, and a runner has none of them.
#
# ACTIONS ARE PINNED BY COMMIT, not by tag. A tag is a moving pointer that its owner can repoint at
# any code, and these jobs run against this repository's contents. The version each hash belongs to
# is in the comment beside it.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here publishes, comments or writes to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    # THE NAME IS A CONTRACT once a rule requires this check: a required check that never reports
    # blocks every merge. So it does not carry the test count, which changes with every test added.
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: substrate
    env:
      PYTHONPATH: ${{ github.workspace }}/substrate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # NOT `uv sync`. The engine's full dependency set is torch, docling and an OpenCV built from
      # source — gigabytes, and twenty minutes of compiling, for a suite that touches none of it.
      # Measured 2026-09-16: these four packages run all 606 tests in 15 seconds from a 57 MB
      # environment. A test that needs more than this should say so by failing here.
      - run: uv venv --python 3.14
      - run: uv pip install pytest pypdfium2 pillow numpy
      - run: uv run --no-sync python -m pytest tests -q

  docling:
    # The job above has no docling, so the paths #64 and #67 broke skip there. This one runs the whole
    # suite against the LOCKED engine, so a docling test added later runs without anyone listing it.
    # MACOS, NOT LINUX: the engine ships for Apple silicon only, the lock resolves torch to its CUDA
    # build on Linux, and ocrmac cannot install there. Nothing here is signed, so the hardened runtime
    # stays `build-bundled-engine`'s to check.
    name: engine docling
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: substrate
    env:
      PYTHONPATH: ${{ github.workspace }}/substrate
      # Opts in the docling round-trips in `tests/test_ingest_formats.py`.
      SUBSTRATE_DOCLING_TESTS: "1"
      # NO MODEL DOWNLOADS. No test needs docling's layout or table weights (measured 2026-11-04: the
      # suite passes offline against an empty HF_HOME). A test that starts needing them fails here by
      # name instead of quietly fetching them on every run.
      HF_HUB_OFFLINE: "1"
      # Build tools are pinned by version, never by hash (`uv sync` takes none). This ignores any file
      # added to those releases later; only the sdist build env is filtered, not the frozen lock.
      # A build-constraint pin newer than this date fails `uv sync` by name: move the date with it.
      UV_EXCLUDE_NEWER: "2026-11-04T00:00:00Z"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # The uv that enforces the lock's hashes, pinned like the lock it reads.
          version: "0.12.2"
      # Minus OpenCV: twenty minutes to compile, and only TableFormer, which needs the weights, uses it.
      # A uv-managed 3.14, as the bundle ships, so `test_bundled_engine_runtime` has one to find.
      - run: >-
          uv sync --frozen --no-dev --group test --managed-python --python 3.14
          --no-install-package opencv-python-headless
      # Fails the job if docling cannot import, rather than letting its tests skip green.
      - run: >-
          uv run --no-sync python -c "import docling.document_converter, torch;
          from importlib.metadata import version;
          print('docling', version('docling'), 'torch', torch.__version__,
          'mps', torch.backends.mps.is_available())"
      # ZERO SKIPS is the point of this job. The one deselected test needs a path that exists only on
      # the operator's Mac, so it skips on every runner.
      - run: >-
          uv run --no-sync python -m pytest tests -q -rsx --junitxml "$RUNNER_TEMP/junit.xml"
          --deselect tests/test_refresh_deploy.py::test_the_shim_falls_back_so_a_machine_with_no_deployment_still_records
      - run: test -s "$RUNNER_TEMP/junit.xml" && ! grep -q '<skipped' "$RUNNER_TEMP/junit.xml"

  core:
    name: app core
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The package targets macOS 14 and uses no macOS 26 API, so it builds on the runner image even
      # though the app around it requires macOS 26 and cannot be built here at all.
      - run: swift test

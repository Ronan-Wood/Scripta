[project]
name = "substrate"
version = "0.1.0"
description = "Language-neutral knowledge substrate engine — structure-aware ingestion + retrieval"
requires-python = ">=3.10"
dependencies = [
    "docling",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ipykernel", "ruff>=0.16.0"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Bug-catchers only. Pyflakes (F), the real-error slices of pycodestyle (E4 import
# placement, E7 incl. `== None`/bare-except, E9 syntax), bugbear (B), and pylint
# errors (PLE). Deliberately NO cosmetic families (import-sort, pyupgrade, simplify):
# this lints for problems, not style. Run: ./lint.sh  (or `uv run ruff check .`).
select = ["F", "E4", "E7", "E9", "B", "PLE"]

# CodeQL, on the engine's Python, which is where untrusted input lands: PDFs, images, zip containers,
# HTML and the JSON a subprocess hands back.
#
# FOR THE ENGINE'S OWN REPOSITORY. GitHub reads `.github` only at a repository's root, so while the
# engine is `substrate/` inside Scripta this file is inert, and Scripta's own `.github` runs its jobs.
#
# Actions pinned by commit, for the reason the test workflow gives.
name: code scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Queries improve between pushes; a weekly run catches what a new query finds in old code.
    - cron: "0 7 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: codeql python
    # Code scanning on a personal account's private repo is a paid feature: the analysis runs, then
    # the upload is refused. Skipped while private, so the job runs again once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # v2.27.0
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # v2.27.0
